<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/qa-flow-logo.png" />
    <link rel="apple-touch-icon" href="/qa-flow-logo.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Flow</title>
    <script data-web-preferences>
      (() => {
        try {
          const savedTheme = localStorage.getItem("qa-flow-theme") || "system";
          const dark = savedTheme === "dark"
            || (savedTheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          const savedLocale = localStorage.getItem("qa-flow-locale");
          if (savedLocale === "pt-BR" || savedLocale === "en-US" || savedLocale === "es-ES") {
            document.documentElement.lang = savedLocale;
          }
        } catch {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: O trabalho de QA vive em uma bancada focal que muda de orientação acolhedora para operação densa; recusa dashboards genéricos e editores modais sem contexto.
      OWN-WORLD: Casco grafite, superfícies brancas compactas, linhas slate e ciano reservado para atividade, seleção, progresso e ação.
      STORY: O QA entende o fluxo no primeiro uso, retoma o que exige atenção e edita casos reutilizáveis sem perder propriedades nem rastreabilidade.
      FIRST VIEWPORT: Menu fixo à esquerda; onboarding em duas áreas quando vazio; dashboard com Agora e riscos quando ativo; editor com conteúdo central e inspetor à direita, convertido em bottom sheet no mobile.
      FORM: Bancada Focal aprovada em composição comp-first; seed control-room-focal-approved.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
