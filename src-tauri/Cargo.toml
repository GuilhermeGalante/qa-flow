[package]
name = "qaflow"
version = "2.1.0"
description = "QA Flow Desktop"
authors = ["Guilherme Galante"]
repository = "https://github.com/GuilhermeGalante/qa-flow"
edition = "2021"
rust-version = "1.98"

[lib]
name = "qaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }

[dev-dependencies]
tempfile = "3"
